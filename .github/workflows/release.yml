name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean HALO-TOEFL-Windows.spec
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/HALO-TOEFL-Windows-x64.exe
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.2
      - name: Set macOS version to 1.0.3
        run: |
          python - <<'PY'
          from pathlib import Path
          init = Path("halo/__init__.py")
          init.write_text('__version__ = "1.0.3"\n', encoding="utf-8")
          spec = Path("HaloTOEFL-macOS.spec")
          text = spec.read_text(encoding="utf-8")
          text = text.replace("'CFBundleShortVersionString': '1.0.2'", "'CFBundleShortVersionString': '1.0.3'")
          text = text.replace("'CFBundleVersion': '3'", "'CFBundleVersion': '4'")
          spec.write_text(text, encoding="utf-8")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create macOS icon
        run: |
          mkdir -p artwork/HALO-TOEFL.iconset
          sips -z 16 16 artwork/HALO-TOEFL-icon.png --out artwork/HALO-TOEFL.iconset/icon_16x16.png
          sips -z 32 32 artwork/HALO-TOEFL-icon.png --out artwork/HALO-TOEFL.iconset/icon_16x16@2x.png
          sips -z 32 32 artwork/HALO-TOEFL-icon.png --out artwork/HALO-TOEFL.iconset/icon_32x32.png
          sips -z 64 64 artwork/HALO-TOEFL-icon.png --out artwork/HALO-TOEFL.iconset/icon_32x32@2x.png
          sips -z 128 128 artwork/HALO-TOEFL-icon.png --out artwork/HALO-TOEFL.iconset/icon_128x128.png
          sips -z 256 256 artwork/HALO-TOEFL-icon.png --out artwork/HALO-TOEFL.iconset/icon_128x128@2x.png
          sips -z 256 256 artwork/HALO-TOEFL-icon.png --out artwork/HALO-TOEFL.iconset/icon_256x256.png
          sips -z 512 512 artwork/HALO-TOEFL-icon.png --out artwork/HALO-TOEFL.iconset/icon_256x256@2x.png
          sips -z 512 512 artwork/HALO-TOEFL-icon.png --out artwork/HALO-TOEFL.iconset/icon_512x512.png
          sips -z 1024 1024 artwork/HALO-TOEFL-icon.png --out artwork/HALO-TOEFL.iconset/icon_512x512@2x.png
          iconutil -c icns artwork/HALO-TOEFL.iconset -o artwork/HALO-TOEFL.icns
      - name: Build macOS application
        run: python -m PyInstaller --noconfirm --clean HaloTOEFL-macOS.spec
      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R "dist/HALO TOEFL.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "HALO TOEFL" -srcfolder dmg -ov -format UDZO "dist/HALO-TOEFL-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/HALO-TOEFL-macOS.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: HALO TOEFL ${{ github.ref_name }}
          draft: true
          files: |
            artifacts/HALO-TOEFL-Windows-x64.exe
            artifacts/HALO-TOEFL-macOS.dmg
          fail_on_unmatched_files: true
